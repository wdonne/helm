apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: {{ include "prefix" . }}kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: "apache/kafka:{{ .Values.kafka.version }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: external
              containerPort: 9094
          env:
            - name: KAFKA_LISTENERS
              value: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
            - name: KAFKA_ADVERTISED_LISTENERS
              value: EXTERNAL://localhost:9094,BROKER://kafka.{{ include "prefix" . }}kafka.svc:9092,CONTROLLER://kafka.{{ include "prefix" . }}kafka.svc:9093
            - name: KAFKA_PROCESS_ROLES
              value: controller,broker
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_BROKER_ID
              value: "0"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS
              value: 0.0.0.0:9093
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka.kafka.svc:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: BROKER
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIR
              value: /opt/kafka/logs
          volumeMounts:
            - mountPath: /opt/kafka/config
              name: config
            - mountPath: /opt/kafka/logs
              name: logs
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      serviceAccountName: kafka
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kafka-config
        - name: logs
          persistentVolumeClaim:
            claimName: kafka-logs
