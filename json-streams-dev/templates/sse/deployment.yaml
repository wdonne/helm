apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse
  namespace: {{ include "prefix" . }}sse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sse
    spec:
      containers:
        - name: sse
          image: "wdonne/pincette-kafka-sse:{{ .Values.sse.version }}"
          imagePullPolicy: IfNotPresent
          command:
            - java
          args:
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000
            - -Dconfig.file=/conf/application.conf
            - -cp
            - "@/app/jib-classpath-file"
            - net.pincette.kafka.sse.Application
            - "9000"
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /conf/application.conf
              subPath: application.conf
          {{- if .Values.sse.extraConfig }}
            - name: extra
              mountPath: /conf/extra.conf
              subPath: extra.conf
          {{- end }}
      serviceAccountName: sse
      volumes:
        - name: config
          configMap:
            name: sse
      {{- if .Values.sse.extraConfig }}
        - name: extra
          configMap:
            name: extra
      {{- end }}
