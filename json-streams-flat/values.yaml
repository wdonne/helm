# Annotations for the deployment.
annotations: { }

# The command arguments for the pod.
args: [ ]

# The command for the pod.
command: [ ]

# The image pull policy for the pod.
imagePullPolicy: IfNotPresent

# Optional secrets for pulling images.
imagePullSecrets: [ ]

# If you set this an HPA is generated.
#maxReplicas: 10

# The node selector for the pod.
nodeSelector: { }

# Annotations for the pod.
podAnnotations: { }

# The port for the pod.
port: 8080

# The default container image registry.
registry: docker.io

# The number of replicas for the deployment. Leave it unset when you have an HPA.
#replicas: 2

# The resources for the pod.
resources:
  requests:
    cpu: 50m
    memory: 20Mi
  limits:
    memory: 20Mi

# The security context for the pod.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  readOnlyRootFilesystem: true

# Tolerations for the pod.
tolerations: [ ]

volumes:
  - name: config
    configMap:
      name: config

volumeMounts:
  - mountPath: /conf
    name: config
    readOnly: true
