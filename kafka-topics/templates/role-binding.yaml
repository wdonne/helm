{{- $namespace := .Release.Namespace -}}
{{- $name := .Chart.Name -}}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
roleRef:
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
  kind: Role
{{- end }}
